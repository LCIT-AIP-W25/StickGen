services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - esdata:/usr/share/elasticsearch/data

  logstash:
    build:
      context: ./final pipeline
      dockerfile: Dockerfile.logstash
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - ./final pipeline/mongodb/:/usr/share/logstash/mongodb/
      - ./final pipeline/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - mongodb
      - elasticsearch
    environment:
      - LOGSTASH_START=1

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  news_api:
    build:
      context: ./news_api
      dockerfile: Dockerfile
    container_name: news_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=docker
      - ENABLE_SYNC=false
    depends_on:
      - mongodb
      - elasticsearch

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3001:80"
    depends_on:
      - news_api

  redis:
    image: redis:7.2.4
    ports:
      - "6379:6379"
    restart: always

volumes:
  esdata:
  mongo_data:
